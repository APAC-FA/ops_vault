<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Ops Vault — Five Acts Services Corp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f7fa;
    --panel:#ffffff;
    --panel-2:#eef2f6;
    --panel-3:#e6ecf2;
    --line:#e1e7ee;
    --line-soft:#ecf0f5;
    --navy:#0e3a5f;
    --navy-dim:#134a76;
    --accent:#12a594;
    --accent-dim:#0d7c70;
    --accent-glow: rgba(18,165,148,0.12);
    --ok:#1f9d6c;
    --ok-dim: rgba(31,157,108,0.12);
    --no:#d64545;
    --no-dim: rgba(214,69,69,0.10);
    --text:#132436;
    --text-dim:#5b6b7c;
    --text-faint:#8fa0af;
    --mono:'IBM Plex Mono',monospace;
    --sans:'Inter',sans-serif;
    --display:'Manrope',sans-serif;
    --radius:10px;
    --shadow: 0 1px 2px rgba(19,36,54,0.04), 0 6px 16px rgba(19,36,54,0.06);
  }
  :root[data-theme="dark"]{
    --bg:#0a1420;
    --panel:#101c2b;
    --panel-2:#172536;
    --panel-3:#1e2f42;
    --line:#26394d;
    --line-soft:#1b2a3b;
    --navy:#8fc4ec;
    --navy-dim:#6fb0e0;
    --accent:#1fd0ba;
    --accent-dim:#17a692;
    --accent-glow: rgba(31,208,186,0.16);
    --ok:#3fd08c;
    --ok-dim: rgba(63,208,140,0.16);
    --no:#f2726b;
    --no-dim: rgba(242,114,107,0.16);
    --text:#e8eef4;
    --text-dim:#a7b6c4;
    --text-faint:#718292;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 6px 20px rgba(0,0,0,0.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);height:100%;-webkit-font-smoothing:antialiased;}
  body{display:flex;min-height:100vh;}
  ::selection{background:var(--accent-glow);color:var(--text);}
  .sidebar,.card,.topbar,.nc-table,.nc-table td,.nc-table th,.search-wrap input,
  .edit-form input,.edit-form textarea,.edit-form select,.icon-btn,.client-chip,
  .nav-item,.btn.ghost,.who-input,.refresh-btn,.theme-toggle,.theme-switch,.theme-switch .knob,
  html,body{
    transition: background-color .18s ease, border-color .18s ease, color .18s ease, box-shadow .18s ease, left .16s ease;
  }

  /* ---------- Sidebar (fixed — stays put while the ledger scrolls) ---------- */
  .sidebar{
    width:260px;flex:0 0 260px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:22px 0 16px;
    position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:15;
  }
  .brand{padding:0 20px 18px;border-bottom:1px solid var(--line-soft);margin-bottom:14px;}
  .brand .mark{
    width:38px;height:38px;border-radius:11px;background:linear-gradient(155deg,var(--navy),var(--accent));
    display:flex;align-items:center;justify-content:center;margin-bottom:12px;box-shadow:var(--shadow);
  }
  .brand .mark svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .brand h1{font-family:var(--display);font-size:16px;letter-spacing:-.01em;margin:0;font-weight:800;color:var(--navy);}
  .brand p{font-family:var(--sans);font-size:11.5px;color:var(--text-faint);margin:4px 0 0;font-weight:500;}
  .brand .tagline{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--accent-dim);margin:8px 0 0;text-transform:uppercase;}

  .nav{padding:0 10px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
    color:var(--text-dim);font-size:13.5px;cursor:pointer;font-family:var(--sans);font-weight:600;
    border-left:2px solid transparent;margin-bottom:2px;transition:background .12s,color .12s;
  }
  .nav-item .num{font-family:var(--mono);font-size:10px;color:var(--text-faint);width:16px;}
  .nav-item:hover{background:var(--panel-2);color:var(--text);}
  .nav-item.active{background:var(--accent-glow);color:var(--accent-dim);border-left-color:var(--accent);}
  .nav-item.active .num{color:var(--accent);}

  .sidebar-section-label{
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--text-faint);
    text-transform:uppercase;padding:18px 20px 8px;
  }
  .client-filters{padding:0 10px;flex:1;overflow-y:auto;}
  .client-chip{
    display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 12px;border-radius:8px;
    font-size:13px;color:var(--text-dim);cursor:pointer;margin-bottom:1px;font-weight:500;
  }
  .client-chip:hover{background:var(--panel-2);color:var(--text);}
  .client-chip.active{background:var(--accent-glow);color:var(--accent-dim);}
  .client-chip .count{font-family:var(--mono);font-size:10px;color:var(--text-faint);}
  .client-chip.active .count{color:var(--accent-dim);}

  .sidebar-footer{padding:14px 20px 0;border-top:1px solid var(--line-soft);margin-top:10px;}

  .theme-toggle{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;margin-bottom:10px;cursor:pointer;user-select:none;
  }
  .theme-toggle:hover{border-color:var(--accent);}
  .theme-toggle .label{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--text-dim);display:flex;align-items:center;gap:6px;}
  .theme-toggle .label svg{width:14px;height:14px;stroke:var(--text-dim);flex:0 0 auto;}
  .theme-switch{width:38px;height:22px;border-radius:20px;background:var(--panel-3);position:relative;flex:0 0 auto;border:1px solid var(--line);}
  .theme-switch .knob{
    position:absolute;top:1px;left:1px;width:18px;height:18px;border-radius:50%;background:var(--accent);
    transition:left .16s ease;box-shadow:var(--shadow);
  }
  [data-theme="dark"] .theme-switch .knob{left:17px;}

  .status-line{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;color:var(--text-faint);margin-bottom:10px;}
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:0 0 auto;box-shadow:0 0 0 3px var(--ok-dim);}
  .refresh-btn{
    width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);font-family:var(--sans);
    font-weight:600;font-size:12.5px;padding:9px;border-radius:8px;cursor:pointer;
  }
  .refresh-btn:hover{border-color:var(--accent);color:var(--accent-dim);background:var(--accent-glow);}

  /* ---------- Main (offset by the fixed sidebar's width) ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;margin-left:260px;}
  .topbar{
    position:sticky;top:0;z-index:5;background:rgba(244,247,250,0.92);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);padding:22px 32px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  :root[data-theme="dark"] .topbar{background:rgba(10,20,32,0.85);}
  .topbar h2{margin:0;font-family:var(--display);font-size:21px;font-weight:800;letter-spacing:-.01em;flex:0 0 auto;color:var(--navy);}
  .topbar .sub{font-family:var(--sans);font-size:12.5px;color:var(--text-dim);margin-top:3px;}
  .topbar-title{margin-right:auto;}
  .search-wrap{position:relative;width:270px;}
  .search-wrap input{
    width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:10px 12px 10px 34px;border-radius:8px;font-family:var(--sans);font-size:13.5px;box-shadow:var(--shadow);
  }
  .search-wrap input:focus{outline:none;border-color:var(--accent);}
  .search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--text-faint);}
  .btn{
    font-family:var(--sans);font-weight:700;font-size:13.5px;padding:10px 16px;border-radius:8px;
    border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow);
  }
  .btn:hover{background:var(--accent-dim);border-color:var(--accent-dim);}
  .btn.ghost{background:var(--panel);border-color:var(--line);color:var(--text-dim);box-shadow:none;}
  .btn.ghost:hover{border-color:var(--text-dim);color:var(--text);background:var(--panel-2);}
  .btn.small{padding:6px 12px;font-size:12.5px;}
  .btn.danger{border-color:var(--no);color:var(--no);background:#fff;}
  .btn.danger:hover{background:var(--no);color:#fff;}

  .content{padding:28px 32px 80px;max-width:1080px;}
  .empty-note{color:var(--text-faint);font-size:13.5px;font-family:var(--sans);padding:30px 0;}

  /* group / card layout */
  .group{margin-bottom:28px;}
  .group-head{
    display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid var(--line);
  }
  .group-head h3{margin:0;font-family:var(--display);font-size:15px;font-weight:800;letter-spacing:-.005em;color:var(--navy);display:flex;align-items:center;gap:9px;}
  .flow-num{
    font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;background:var(--navy);
    width:22px;height:22px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  }
  .group-head .tag{
    font-family:var(--mono);font-size:10px;color:var(--accent-dim);background:var(--accent-glow);
    padding:2px 8px;border-radius:20px;border:1px solid rgba(18,165,148,0.25);
  }
  .group-head .scope-tag{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:20px;border:1px solid;
  }
  .group-head .scope-tag.seb{color:#7a3fc9;background:rgba(122,63,201,0.10);border-color:rgba(122,63,201,0.28);}
  .group-head .scope-tag.nonseb{color:#b8770a;background:rgba(184,119,10,0.10);border-color:rgba(184,119,10,0.28);}
  .group-head .scope-tag.misc{color:#1f7a4d;background:rgba(31,122,77,0.10);border-color:rgba(31,122,77,0.28);}
  .group-head .scope-tag.multi{color:var(--navy-dim);background:var(--panel-3);border-color:var(--line);}
  .group-head .add-inline{margin-left:auto;}

  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:10px;
    position:relative;box-shadow:var(--shadow);transition:border-color .12s,transform .08s,box-shadow .12s;
  }
  .card:hover{border-color:#cfdae4;}
  [data-theme="dark"] .card:hover{border-color:#33495f;}
  .card:hover .card-actions{opacity:1;}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .card-top-left{display:flex;align-items:flex-start;gap:12px;min-width:0;}
  .card-icon{
    width:38px;height:38px;flex:0 0 auto;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .card-icon img{width:26px;height:26px;object-fit:contain;}
  .card-title{font-weight:700;font-size:14.5px;color:var(--text);font-family:var(--sans);}
  .card-meta{font-family:var(--mono);font-size:10.5px;color:var(--accent-dim);margin-top:4px;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .platform-badge{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:var(--navy-dim);background:var(--panel-3);
    padding:1px 7px;border-radius:20px;text-transform:uppercase;
  }
  .card-body{margin-top:9px;font-size:13.5px;line-height:1.6;color:var(--text-dim);white-space:pre-wrap;}
  .card-body a{color:var(--accent-dim);}
  .card-actions{opacity:0;transition:opacity .12s;display:flex;gap:6px;flex:0 0 auto;}
  .icon-btn{
    width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:7px;
    border:1px solid var(--line);background:var(--panel-2);cursor:pointer;
  }
  .icon-btn svg{width:13px;height:13px;stroke:var(--text-dim);}
  .icon-btn:hover{border-color:var(--accent);background:var(--accent-glow);}
  .icon-btn:hover svg{stroke:var(--accent-dim);}
  .icon-btn.del:hover{border-color:var(--no);background:var(--no-dim);}
  .icon-btn.del:hover svg{stroke:var(--no);}

  .empty-url{color:var(--text-faint);font-style:italic;}

  /* form */
  .edit-form{display:flex;flex-direction:column;gap:10px;}
  .edit-form label{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--text-faint);text-transform:uppercase;}
  .edit-form input[type=text], .edit-form textarea, .edit-form select{
    width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    padding:9px 11px;border-radius:8px;font-family:var(--sans);font-size:13.5px;resize:vertical;
  }
  .edit-form input:focus, .edit-form textarea:focus, .edit-form select:focus{outline:none;border-color:var(--accent);background:var(--panel);}
  .edit-form textarea{min-height:70px;}
  .form-row{display:flex;gap:8px;}
  .form-actions{display:flex;gap:8px;margin-top:2px;}

  /* Name change table */
  .nc-table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
  .nc-table th{
    text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);
    padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel-2);
  }
  .nc-table td{padding:11px 16px;border-bottom:1px solid var(--line-soft);font-size:13.5px;}
  .nc-table tr:last-child td{border-bottom:none;}
  .nc-table tr:hover{background:var(--panel-2);}
  .nc-client{font-weight:600;}
  .stamp{
    font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:4px 10px;border-radius:20px;
    display:inline-block;text-transform:uppercase;cursor:pointer;border:1px solid transparent;
  }
  .stamp.yes{color:var(--ok);background:var(--ok-dim);border-color:rgba(31,157,108,0.3);}
  .stamp.no{color:var(--no);background:var(--no-dim);border-color:rgba(214,69,69,0.3);}
  .stamp.unknown{color:var(--text-faint);background:var(--panel-2);border-color:var(--line);}
  .stamp.locked{cursor:default;}
  .nc-actions{opacity:0;transition:opacity .12s;}
  .nc-table tr:hover .nc-actions{opacity:1;}

  .who-input{
    font-family:var(--sans);font-size:12.5px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    padding:8px 10px;border-radius:8px;width:100%;
  }
  .who-input:focus{outline:none;border-color:var(--accent);}

  /* Canned messages grid */
  .qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;}
  .qr-card{margin-bottom:0;cursor:pointer;user-select:none;}
  .qr-card:hover{border-color:var(--accent);box-shadow:0 2px 4px rgba(19,36,54,0.06), 0 10px 20px rgba(18,165,148,0.10);}
  .qr-card:active{transform:scale(0.985);}
  .qr-card.copied-flash{border-color:var(--ok);background:var(--ok-dim);}
  .qr-text{font-family:var(--mono);font-size:12.5px;line-height:1.55;}
  .qr-hint{
    margin-top:10px;padding-top:8px;border-top:1px dashed var(--line-soft);
    font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);
    display:flex;align-items:center;gap:5px;
  }
  .qr-hint svg{width:11px;height:11px;stroke:var(--text-faint);}
  .icon-btn.copy-btn.copied{border-color:var(--ok);background:var(--ok-dim);}
  .icon-btn.copy-btn.copied svg{stroke:var(--ok);}

  /* Flow toggle (SEB vs Non-SEB vs Miscellaneous) */
  .flow-toggle-wrap{
    display:flex;align-items:center;gap:14px;margin-bottom:24px;padding:14px 16px;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);flex-wrap:wrap;
  }
  .flow-toggle-label{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);}
  .flow-toggle{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;}
  .flow-toggle button{
    font-family:var(--sans);font-weight:700;font-size:13px;padding:8px 16px;border-radius:7px;border:none;
    background:transparent;color:var(--text-dim);cursor:pointer;transition:background .12s,color .12s;
  }
  .flow-toggle button.active{background:var(--navy);color:#fff;box-shadow:var(--shadow);}
  .flow-toggle button.active.seb-active{background:#7a3fc9;}
  .flow-toggle button.active.misc-active{background:#1f7a4d;}
  .flow-toggle-note{font-family:var(--sans);font-size:12px;color:var(--text-dim);margin-left:auto;}

  /* Toast */
  #toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--navy);color:#fff;font-family:var(--sans);font-weight:600;font-size:13px;
    padding:12px 20px;border-radius:10px;box-shadow:0 8px 24px rgba(19,36,54,0.28);
    opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50;display:flex;align-items:center;gap:8px;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast svg{width:15px;height:15px;stroke:var(--ok);flex:0 0 auto;}

  @media (max-width:860px){
    .main{margin-left:0;}
    .sidebar{left:-270px;z-index:20;box-shadow:0 0 40px rgba(19,36,54,.18);}
    .sidebar.open{left:0;}
    .topbar{padding:16px;}
    .content{padding:18px 16px 60px;}
    .search-wrap{width:100%;order:3;}
    .mobile-toggle{display:flex !important;}
    .flow-toggle-note{margin-left:0;width:100%;}
  }
  .mobile-toggle{
    display:none;width:36px;height:36px;border:1px solid var(--line);border-radius:8px;
    align-items:center;justify-content:center;cursor:pointer;background:var(--panel);flex:0 0 auto;box-shadow:var(--shadow);
  }
  .mobile-toggle svg{width:16px;height:16px;stroke:var(--text-dim);}
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V5l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg></div>
    <h1>Ops Vault</h1>
    <p>Client policy &amp; FAQ ledger</p>
    <p class="tagline">Secure · Reliable · Remote</p>
  </div>
  <div class="nav" id="nav"></div>
  <div class="sidebar-section-label">Filter by client</div>
  <div class="client-filters" id="clientFilters"></div>
  <div class="sidebar-footer">
    <div class="theme-toggle" id="themeToggle">
      <span class="label">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <span id="themeLabelText">Light mode</span>
      </span>
      <div class="theme-switch"><div class="knob"></div></div>
    </div>
    <div class="status-line"><span class="status-dot"></span><span id="statusText">loading…</span></div>
    <input class="who-input" id="whoInput" placeholder="Editing as (your name)" style="margin-bottom:8px;">
    <button class="refresh-btn" id="refreshBtn">↻ Refresh now</button>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <div class="mobile-toggle" id="mobileToggle">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </div>
    <div class="topbar-title">
      <h2 id="sectionTitle">Exam Policies</h2>
      <div class="sub" id="sectionSub">—</div>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="Search client, keyword…">
    </div>
    <button class="btn" id="addTopBtn">+ Add entry</button>
  </div>
  <div class="content" id="content"></div>

// The exact proctoring flow, in order. "scope" controls whether a step shows under the
// Non-SEB toggle, the SEB toggle, the Miscellaneous toggle, or all of them ('both').
// Step 10 branches by exam type; everything else is shared unless flagged otherwise.
const CANNED_FLOW = [
  {key:'welcome',              num:1,  label:'Welcome',                         scope:['nonseb','seb']},
  {key:'id-verification',      num:2,  label:'Identification Verification',     scope:['nonseb','seb']},
  {key:'system-verification',  num:3,  label:'System Verification',             scope:'nonseb'},
  {key:'clear-desk',           num:4,  label:'Clear Desk',                      scope:['nonseb','seb']},
  {key:'room-scan',            num:5,  label:'Room Scan',                       scope:['nonseb','seb']},
  {key:'exam-release',         num:6,  label:'Exam Release',                    scope:['nonseb','seb']},
  {key:'misc',                 num:7,  label:'Miscellaneous',                   scope:'misc'},
  {key:'warnings',             num:8,  label:'Warnings',                        scope:'misc'},
  {key:'tech-support',         num:9,  label:'Technical Support',               scope:'misc'},
  {key:'nonseb',               num:10, label:'Non-SEB Exams',                   scope:'nonseb'},
  {key:'seb',                  num:10, label:'SEB — Secure Exam Browser',       scope:'seb'},
  {key:'termination',          num:11, label:'Termination Messages',            scope:'misc'},
];
const ALL_FLOW_MODES = ['nonseb','seb','misc'];
function includedModes(f){
  if(f.scope==='both') return ALL_FLOW_MODES.slice();
  if(Array.isArray(f.scope)) return f.scope;
  return [f.scope];
}
function stepMatchesMode(f, mode){
  return includedModes(f).includes(mode);
}
function getVisibleFlow(mode){
  return CANNED_FLOW.filter(f=> stepMatchesMode(f, mode));
}
const FLOW_MODE_LABELS = {nonseb:'Non-SEB', seb:'SEB', misc:'Miscellaneous'};
// Human-readable badge describing which tab(s) a step is scoped to, or null if it shows everywhere.
function scopeTagText(f){
  const inc = includedModes(f);
  if(inc.length===ALL_FLOW_MODES.length) return null;
  if(inc.length===1) return FLOW_MODE_LABELS[inc[0]] + ' only';
  const excluded = ALL_FLOW_MODES.filter(m=>!inc.includes(m));
  return 'Not shown under ' + excluded.map(m=>FLOW_MODE_LABELS[m]).join(' or ');
}
function flowDef(key){ return CANNED_FLOW.find(f=>f.key===key); }

      {id:uid(),client:'General',category:'General',question:'Can I end or cancel a session without confirmation?',answer:'No. Do not END or cancel an either AI or Scheduled session without prior confirmation from the candidate or a member of the Candidate Support team. Once confirmed — Close the session window only. Do not cancel or END the session unless specifically instructed to do so by the appropriate support team.'},

      {id:uid(),client:'HashiCorp',category:'General',question:'Can I use an external monitor?',answer:'Only one monitor may be used during the exam. If using an external monitor, the laptop screen must be closed, and the external monitor must have a webcam that stays on throughout — the laptop webcam cannot be used at the same time.'},
      {id:uid(),client:'HashiCorp',category:'General',question:'How do I reschedule my appointment?',answer:'More than 24 hours before your appointment:\n1. Log in to the HashiCorp Cloud Engineer Certification Exam Portal.\n2. Navigate to Certiverse via the left-side menu.\n3. From the Certiverse Exam Dashboard, find your appointment.\n4. Select Reschedule and pick a new date/time.'},
      {id:uid(),client:'HashiCorp',category:'General',question:'How do I cancel my appointment?',answer:'More than 24 hours before your appointment:\n1. Log in to the HashiCorp Cloud Engineer Certification Exam Portal.\n2. Navigate to Certiverse via the left-side menu.\n3. Find your appointment on the Certiverse Exam Dashboard.\n4. Select Cancel Booking.\nVoucher payments are reinstated with original expiration/restrictions. Card payments are refunded, which can take up to 10 business days.'},
      {id:uid(),client:'HashiCorp',category:'General',question:'Can I use a calculator?',answer:'Calculators are prohibited. A calculator is available within the exam itself. Using an external one may result in the exam being terminated.'},
      {id:uid(),client:'HashiCorp',category:'General',question:'How do I open Task Manager on a Mac?',answer:'Press CMD + ALT + ESC simultaneously.'},
      {id:uid(),client:'SS&C Blue Prism',category:'Exam Results',question:'When will I see my results?',answer:'Results appear immediately after the exam ends. A Certiverse email with a score report link is also sent. Score reports can be viewed anytime under History on the Certiverse Exam Dashboard.'},
      {id:uid(),client:'NVIDIA',category:'Exam Results',question:'When will I see my results?',answer:'Results are shown on screen at the end of the exam and communicated by email within up to 24 hours. Digital credentials are emailed within 24 hours — log into Credly to accept the badge (instructions are in the invitation email).'},
      {id:uid(),client:'HashiCorp',category:'Exam Results',question:'HASHI-ASSOC — when will I see my results?',answer:'Pass/fail status is available in the Certiverse system immediately upon completing the exam.'},
      {id:uid(),client:'HashiCorp',category:'Exam Results',question:'HASHI-VAULT — when will I see my results?',answer:'An email with results is sent within 48 hours after the appointment.'},
      {id:uid(),client:'General',category:'Exam Results',question:'What does a "red screen" mean?',answer:'It means the system may have detected something that should not be opened or done during the exam.'},
      {id:uid(),client:'General',category:'ID Verification',question:'What are the ID requirements for testing?',answer:
`All IDs must be valid, government-issued originals (photocopies are not accepted) and must include:
• The test-taker's name
• A recent, recognizable photo.
• The first and last names on the ID must match exactly the name used to register for the exam.

Test-Takers Under 18
A parent or guardian must present their own valid ID during check-in and provide consent for the test-taker to be recorded. The test-taker should also present a government-issued ID if they have one. If they do not have a government-issued ID, a student ID is acceptable.

Acceptable Forms of ID
• International travel passport
• Driver's license
• National, state, or provincial identification card
• Alien registration card (green card or permanent resident/visa)
• Health Cards

Unacceptable Forms of ID
• Expired IDs — IDs must be current and valid at the time of the exam.
• Military IDs
• Digital IDs — All IDs must be physical, government-issued documents with a clear photo and unaltered information. Digital IDs are not accepted.
• Restricted access IDs — including the U.S. Department of Defense (DoD) Common Access Card (CAC) and similar secure access credentials.
• IDs from restricted countries or regions — IDs issued by North Korea, Cuba, Syria, Sudan, Iran, or the Sevastopol/Crimea region of Ukraine are not accepted.

Source: Certiverse Identification Requirements — https://success.certiverse.com/hc/en-us/articles/50836942992539-Certiverse-Identification-Requirements`},
      {id:uid(),client:'NVIDIA',category:'Breaks',question:'How many breaks am I allowed?',answer:'One 5-minute break is allowed. You may request it at any point in the exam — the exam pauses and resumes on your return. If the break runs longer than 5 minutes, the exam will be terminated.'},
      {id:uid(),client:'General',category:'General',question:'What if I require special accommodations for my exam?',answer:'For future accommodations — Please submit an accommodations request at least three business days with your exam sponsor before your appointment to discuss your specific needs.'},
      {id:uid(),client:'General',category:'Exam Results',question:'When will I receive my results and certificate?',answer:'After completing and passing your exam, it may take up to 72 hours for your answers to be validated. Once that process is complete, your full score report, certificate, and badge will be sent to you by email. If you have not received them after 72 hours, please contact your exam organization for follow-up.'},

    canned:[
      // 1. Welcome
      {id:uid(),category:'welcome',label:'Welcome Greeting',text:`Hello and welcome! I will be your proctor for this exam.`},
      {id:uid(),category:'welcome',label:'Prep Time Notice',text:`We have a few steps to complete before your exam begins. This time does not count against your exam time limit.`},
      {id:uid(),category:'welcome',label:'Please Hold',text:`Please hold while we prepare your exam. Thank you for waiting.`},

      // 2. Identification Verification
      {id:uid(),category:'id-verification',label:'Show ID (Front)',text:`We will need to verify your identity before we release the exam. Please show the front of your valid identification (ID) to the camera. You may use the camera preview on your screen as a guide to confirm your ID is fully visible.`},
      {id:uid(),category:'id-verification',label:'Bring ID Closer',text:`Please bring your ID closer to the camera view.`},
      {id:uid(),category:'id-verification',label:'Hold ID Steady',text:`Please hold your ID steady.`},
      {id:uid(),category:'id-verification',label:'Flip ID',text:`Please flip your ID.`},
      {id:uid(),category:'id-verification',label:'Show Expiration Date',text:`Please show the expiration date.`},
      {id:uid(),category:'id-verification',label:'ID Blurry',text:`Your ID appears blurry on the screen. Could you please adjust it, so it is clearly visible? You may try improving the lighting, placing it flat on the desk, or holding it still for a moment.`},
      {id:uid(),category:'id-verification',label:'No Valid ID',text:`You must present a valid government-issued ID to test today. If you do not have one available, you can contact support@certiverse.com for further assistance in rescheduling.`},
      {id:uid(),category:'id-verification',label:'Name Mismatch — Candidate Requests Change',text:`Unfortunately, that is not the name registered for this reservation. Per Certiverse rules, the name on your ID must fully match the exam reservation. To proceed, please request a name change by contacting support@certiverse.com.`},
      {id:uid(),category:'id-verification',label:'Name Mismatch — Sponsor Processes Change',text:`Unfortunately, that is not the name registered for this reservation. Per Certiverse rules, the name on your ID must fully match the exam reservation. To assist you in reaching out to the exam sponsor who will process the name change, please contact support@certiverse.com.`},
      {id:uid(),category:'id-verification',label:'Re-enter After Name Change',text:`Once completed, you can re-enter the reservation and we will continue.`},
      {id:uid(),category:'id-verification',label:'ID Accepted',text:`Thank you. You may put your ID away.`},

      // 3. System Verification ✦ NEW
      {id:uid(),category:'system-verification',platform:'ALL',label:'Close All Applications',text:`Please make sure that all running applications are closed and shut down. This includes all browser tabs that are not the exam.`},
      {id:uid(),category:'system-verification',platform:'ALL',label:'Close Other Certiverse Tab',text:`Please also close the other Certiverse tab, leaving only this one open.`},
      {id:uid(),category:'system-verification',platform:'WINDOWS',label:'Task Manager Check',text:`Please open your Task Manager. Then, scroll down slowly until you reach the end of the list.`},
      {id:uid(),category:'system-verification',platform:'WINDOWS',label:'System Tray Check',text:`Please open your System Tray by clicking the arrow icon (^) at the bottom-right corner of your taskbar. Right-click each application and close any that offers a "Quit" or "Exit" option.`},
      {id:uid(),category:'system-verification',platform:'MAC',label:'Activity Monitor Check',text:`Please open your Activity Monitor. Please scroll down slowly until you reach the end of the list.`},
      {id:uid(),category:'system-verification',platform:'MAC',label:'Force Quit Applications',text:`Press Option + Command + Esc simultaneously to open the Force Quit Applications window and ensure all applications not related to the exam are closed.`},
      {id:uid(),category:'system-verification',platform:'LINUX',label:'System Monitor Check',text:`Please open your System Monitor. Please go to the Processes tab and scroll down slowly until you reach the end of the list.`},
      {id:uid(),category:'system-verification',platform:'LINUX',label:'Force Quit Applications',text:`Please close or force quit any applications not related to the exam. If needed, select the application and choose "End Process" or "Kill Process."`},

      // 4. Clear Desk
      {id:uid(),category:'clear-desk',label:'Remove Desk Items',text:`Thank you. If there are any items on your desk surface, please remove them now.`},
      {id:uid(),category:'clear-desk',label:'Electronics Away',text:`Ensure all electronic devices are put away and out of reach. This includes phones, smartwatches, headphones, smart glasses, and any other electronic device.`},
      {id:uid(),category:'clear-desk',label:'Headphones Not Allowed',text:`Headphones are not allowed during the exam. Please remove them and put them away.`},
      {id:uid(),category:'clear-desk',label:'Hats Not Allowed',text:`Hats are not allowed during the exam. Please remove your hat and put it away.`},
      {id:uid(),category:'clear-desk',label:'Remove Smartwatch',text:`Please remove your smartwatch and place it out of reach.`},
      {id:uid(),category:'clear-desk',label:'Confirm No Smartwatch',text:`Please roll up your sleeve to confirm there is no smartwatch being worn during the exam.`},
      {id:uid(),category:'clear-desk',label:'One Monitor Only',text:`As outlined in the exam policies, only one laptop or computer without extra screens is allowed. Please remove or cover any additional monitors so they are not facing you directly.`},

      // 5. Room Scan
      {id:uid(),category:'room-scan',label:'Room Scan Request',text:`Thank you. We will now scan the room to confirm all security policies are followed. Please slowly direct your webcam or laptop camera around the room. You will need to capture the entire room and the area on your desk.`},
      {id:uid(),category:'room-scan',label:'Scan Technique Guidance',text:`When doing the room scan, please hold your laptop in a way that allows the camera to clearly capture the room. Rotate it slowly and make sure nothing blocks the view, so I can see all areas of your workspace, including the desk, floor, walls, and surrounding environment.`},
      {id:uid(),category:'room-scan',label:'Show Desk Area',text:`Please show the desk area.`},
      {id:uid(),category:'room-scan',label:'Show Under Desk',text:`Please show the area under the desk.`},
      {id:uid(),category:'room-scan',label:'Electronics Off',text:`All electronics should be out of reach and turned off.`},
      {id:uid(),category:'room-scan',label:'Clear Desk Confirmation',text:`Please ensure your desk is clear of all items.`},
      {id:uid(),category:'room-scan',label:'Repeat Room Scan',text:`Please direct your camera around the room one more time.`},
      {id:uid(),category:'room-scan',label:'Capture All Corners',text:`Please make sure to capture all corners and edges of your desk during the room scan.`},
      {id:uid(),category:'room-scan',label:'Improve Lighting',text:`Is it possible for you to improve the lighting in your testing area?`},
      {id:uid(),category:'room-scan',label:'Backlight Issue',text:`The window behind you is creating a backlight effect. Adjusting the lighting or moving slightly would help us proceed.`},
      {id:uid(),category:'room-scan',label:'No Interruptions',text:`Please ensure no one else is present and that no one enters or interrupts during the exam, as this is against Certiverse rules and may lead to termination.`},

      // 6. Exam Release
      {id:uid(),category:'exam-release',label:'Hide Video Button',text:`You may now click the hide video button.`},
      {id:uid(),category:'exam-release',label:'Pre-Exam Questions',text:`Thank you. Do you have any questions before beginning your exam?`},
      {id:uid(),category:'exam-release',label:'Reconnection Notice',text:`If your session gets disconnected at any point during the exam, please be reminded that we will need to verify the security of your device and environment upon reconnection.`},
      {id:uid(),category:'exam-release',label:'Use Chat for Questions',text:`Please use this chat if you have any questions that are not related to the exam content. I will now release your exam.`},
      {id:uid(),category:'exam-release',label:'Hide Chat Button',text:`You can click on the Hide Chat button at the top-right corner to begin your exam.`},

      // 7. Miscellaneous
      {id:uid(),category:'misc',label:'Breaks Not Allowed',text:`Breaks are not allowed for this exam.`},
      {id:uid(),category:'misc',label:'Break Allowance — 5 Minutes',text:`You may take one 5-minute break during your exam. The session will be paused while you're away and resumed once you return. Please make sure to come back within 5 minutes, as exceeding this time is against Certiverse rules.`},
      {id:uid(),category:'misc',label:'Break Allowance — Multiple, As Needed',text:`You may take one 5-minute break at a time during your exam. You may take breaks whenever needed. The session will be paused while you are away and will resume once you return. Please make sure to come back within 5 minutes, as exceeding this time is against Certiverse rules.`},
      {id:uid(),category:'misc',label:'Return Time Reminder (Fill-in Minutes)',text:`Please make sure to come back within _ minutes, as exceeding this time is against Certiverse rules.`},
      {id:uid(),category:'misc',label:'Custom Break Duration (Fill-in Minutes)',text:`You may now take a one _ minute break. Please make sure to come back within _ minutes, as exceeding this time is against Certiverse rules.`},

      {id:uid(),category:'misc',label:'Results & Certificate Timeline',text:`After completing and passing your exam, it may take up to 72 hours for your answers to be validated. Once that process is complete, your full score report, certificate, and badge will be sent to you by email. If you have not received them after 72 hours, please contact your exam organization for follow-up.`},

      {id:uid(),category:'warnings',label:'No Talking Aloud',text:`Please refrain from talking aloud.`},

      // 9. Technical Support
      {id:uid(),category:'tech-support',label:'Camera Switch Check',text:`Please check for a camera switch or button on your device. Some laptops have a physical switch that turns the camera on or off. If your laptop has one, make sure it is in the on position before using your camera. Otherwise, please check if your camera has a sliding cover and slide it open.`},

function uid(){ return Math.random().toString(36).slice(2,10); }
// Older saved vaults may have the Canned Messages ledger in an earlier shape (or missing
// entirely) — detect that and reseed the correct flow-based set without touching anything else.
function backfillCannedMessages(){
  if(!data) return;
  const validKeys = CANNED_FLOW.map(f=>f.key);
  const isCurrentShape = Array.isArray(data.canned)
    && data.canned.length > 0
    && data.canned.every(r=> r && typeof r.category==='string' && validKeys.includes(r.category) && typeof r.label==='string' && typeof r.text==='string');
  if(!isCurrentShape){
    data.canned = seedData().canned;
    persist();
  }
}
// Older saved vaults were created before the Incident Thresholds ledger existed — backfill it
// in place without touching anything else the team has already filed.
function backfillIncidents(){
  if(!data) return;
  if(!Array.isArray(data.incidents) || data.incidents.length===0){
    data.incidents = seedData().incidents;
    persist();
  }
}
// Older saved vaults were created before the Troubleshooting Guide had quick canned messages
// attached to each issue — backfill just the messages onto matching entries, in place, without
// touching any step-by-step text the team has already edited.
function backfillTroubleshootingMessages(){
  if(!data || !Array.isArray(data.troubleshooting)) return;
  const seedTS = seedData().troubleshooting;
  let changed = false;
  data.troubleshooting.forEach(rec=>{
    if(!Array.isArray(rec.messages) || rec.messages.length===0){
      const match = seedTS.find(s=> s.client===rec.client);
      if(match && Array.isArray(match.messages) && match.messages.length){
        rec.messages = match.messages;
        changed = true;
      }
    }
  });
  if(changed) persist();
}

// Akylade was removed as a client — strip any already-persisted records for it across every
// client-scoped section so older saved vaults stay in sync without touching anything else.
function removeRetiredClients(){
  if(!data) return;
  const RETIRED = ['Akylade'];
  let changed = false;
  ['policies','namechange','websites','remote'].forEach(sectionKey=>{
    if(!Array.isArray(data[sectionKey])) return;
    const before = data[sectionKey].length;
    data[sectionKey] = data[sectionKey].filter(r=> !RETIRED.includes(r.client));
    if(data[sectionKey].length !== before) changed = true;
  });
  if(changed) persist();
}

/* ============================= STORAGE ============================= */
async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value){
      data = JSON.parse(res.value);
      dataRaw = res.value;
      backfillCannedMessages();
      backfillIncidents();
      backfillTroubleshootingMessages();
      removeRetiredClients();
      backfillFaqUpdates();
      backfillCannedMessageUpdates();
      backfillFlagDecision();
      setStatus('synced — shared with your team');
    } else {
      data = seedData();
      await persist();
      setStatus('vault initialized');
    }
  }catch(e){
    console.error('load failed, using local seed', e);
    if(!data) data = seedData();
    setStatus('offline — changes may not sync', true);
  }
  render();
}
async function persist(){
  try{
    const str = JSON.stringify(data);
    const res = await window.storage.set(STORAGE_KEY, str, true);
    if(res){ dataRaw = str; setStatus('saved — visible to your team'); }
    else { setStatus('save failed, will retry', true); }
  }catch(e){
    console.error('save failed', e);
    setStatus('save failed, will retry', true);
  }
}
async function pollForChanges(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value && res.value !== dataRaw){
      data = JSON.parse(res.value);
      dataRaw = res.value;
      render();
      setStatus('updated by a teammate just now');
    }
  }catch(e){ /* silent */ }
}
function setStatus(text, warn){
  const el = document.getElementById('statusText');
  el.textContent = text;
  const dot = document.querySelector('.status-dot');
  dot.style.background = warn ? 'var(--no)' : 'var(--ok)';
  dot.style.boxShadow = '0 0 0 3px ' + (warn ? 'var(--no-dim)' : 'var(--ok-dim)');
}
function whoAmI(){
  return (document.getElementById('whoInput').value || '').trim() || 'Someone';

/* ============================= THEME ============================= */
async function initTheme(){
  let theme = 'light';
  try{
    const res = await window.storage.get(THEME_KEY, false);
    if(res && res.value === 'dark') theme = 'dark';
  }catch(e){ /* no saved preference yet — default to light */ }
  applyTheme(theme);
}
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  const labelEl = document.getElementById('themeLabelText');
  if(labelEl) labelEl.textContent = theme === 'dark' ? 'Dark mode' : 'Light mode';
}
async function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try{ await window.storage.set(THEME_KEY, next, false); }catch(e){ /* theme just won't persist across sessions */ }
}

// Every client name across every section, so the sidebar always reflects the whole vault
const NON_CLIENT_SECTIONS = ['troubleshooting','canned','incidents','flagdecision']; // categories here aren't real clients, keep them out of the sidebar filter
const NON_CLIENT_NAMES = ['Remote Access Tools (Reference)']; // generic reference bucket, not a real client
function allClientsGlobal(){
  const set = new Set();
  Object.keys(SECTIONS).forEach(sectionKey=>{
    if(NON_CLIENT_SECTIONS.includes(sectionKey)) return;
    (data[sectionKey]||[]).forEach(r=>{ if(r.client && !NON_CLIENT_NAMES.includes(r.client)) set.add(r.client); });
  });
  return Array.from(set).sort((a,b)=>a.localeCompare(b));
}
function countForClient(clientName){
  let total = 0;
  Object.keys(SECTIONS).forEach(sectionKey=>{
    if(NON_CLIENT_SECTIONS.includes(sectionKey)) return;
    total += (data[sectionKey]||[]).filter(r=>r.client===clientName).length;
  });
  return total;
}
function renderClientFilters(){
  const wrap = document.getElementById('clientFilters');
  const clients = allClientsGlobal();
  wrap.innerHTML = '';
  const allChip = document.createElement('div');
  allChip.className = 'client-chip' + (!clientProfileMode ? ' active':'');
  const totalCount = Object.keys(SECTIONS).reduce((sum,k)=> sum + (data[k]||[]).length, 0);
  allChip.innerHTML = `<span>All clients</span><span class="count">${totalCount}</span>`;
  allChip.onclick = ()=>{ activeClient=null; clientProfileMode=false; render(); };

    none.style.cssText = 'padding:6px 12px;color:var(--text-faint);font-size:11.5px;font-family:var(--mono);';
    none.textContent = 'No clients filed yet';

  clients.forEach(c=>{

    chip.className = 'client-chip' + (clientProfileMode && activeClient===c ? ' active':'');
    chip.innerHTML = `<span>${esc(c)}</span><span class="count">${count}</span>`;
    chip.onclick = ()=>{
      activeClient = c;
      clientProfileMode = true;
      render();
    };
    wrap.appendChild(chip);
  });
}

/* ============================= HELPERS ============================= */
function esc(s){
  return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function linkify(text){
  const e = esc(text);
  return e.replace(/(https?:\/\/[^\s<]+)/g, url=>`<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
}
function matchesSearch(record){
  if(!searchTerm) return true;
  const t = searchTerm.toLowerCase();
  return Object.values(record).some(v=> String(v||'').toLowerCase().includes(t));
}

/* ============================= RENDER ============================= */
function render(){
  renderNav();
  renderClientFilters();
  const addTopBtn = document.getElementById('addTopBtn');

  if(clientProfileMode && activeClient){
    document.getElementById('sectionTitle').textContent = activeClient;
    document.getElementById('sectionSub').textContent = 'Everything on file for this client — exam policies, name-change policy, FAQs, website';
    addTopBtn.style.display = 'none';
    renderClientProfile(activeClient);
    return;
  }
  addTopBtn.style.display = '';

  const cfg = SECTIONS[activeSection];
  document.getElementById('sectionTitle').textContent = cfg.label;
  document.getElementById('sectionSub').textContent = cfg.sub;
  const content = document.getElementById('content');
  content.innerHTML = '';

  if(activeSection === 'namechange'){ renderNameChangeTable(content); return; }
  if(activeSection === 'incidents'){ renderIncidentsTable(content); return; }
  if(activeSection === 'flagdecision'){ addTopBtn.style.display='none'; renderFlagDecision(content); return; }

  // Canned Messages is a fully custom, flow-grouped ledger (own toggle, add/edit/copy/delete UI) — no generic list below it.
  if(activeSection === 'canned'){
    addTopBtn.style.display = 'none';
    renderCannedMessages(content);
    return;
  }

  if(activeSection === 'remote' && REMOTE_APP_IMAGES.length){
    const gallery = document.createElement('div');
    gallery.className = 'group';
    gallery.innerHTML = `<div class="group-head"><h3>Icon reference sheet</h3></div>`;
    const imgsWrap = document.createElement('div');
    imgsWrap.style.cssText = 'display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);align-items:start;';
    REMOTE_APP_IMAGES.forEach(src=>{
      const img = document.createElement('img');
      img.src = src;
      img.style.cssText = 'width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:6px;background:#fff;';
      imgsWrap.appendChild(img);
    });
    gallery.appendChild(imgsWrap);
    content.appendChild(gallery);
  }

  let records = (data[activeSection]||[]).filter(matchesSearch);

  if(records.length===0){
    content.innerHTML += '<div class="empty-note">Nothing here yet. Use "+ Add entry" to file the first record.</div>';
    return;
  }

  // group by client
  const groups = {};
  records.forEach(r=>{
    const g = r.client || 'Unassigned';
    if(!groups[g]) groups[g]=[];
    groups[g].push(r);
  });
  Object.keys(groups).sort((a,b)=>a.localeCompare(b)).forEach(clientName=>{
    const groupEl = document.createElement('div');
    groupEl.className = 'group';
    groupEl.innerHTML = `<div class="group-head"><h3>${esc(clientName)}</h3><span class="tag">${groups[clientName].length}</span></div>`;
    const list = document.createElement('div');
    groups[clientName].forEach(rec=> list.appendChild(renderCard(rec, activeSection)) );
    groupEl.appendChild(list);
    content.appendChild(groupEl);
  });
}

      } else {
        records.forEach(rec=> list.appendChild(renderCard(rec, sectionKey)) );
      }
      groupEl.appendChild(list);
    }
    content.appendChild(groupEl);
  });
}

async function changeAllowedStatus(rec){
  const input = prompt('Update the declared name-change status for "'+rec.client+'".\nType Yes, No, or Unknown:', rec.allowed||'Unknown');
  if(input===null) return;
  const valid = ['Yes','No','Unknown'];
  const match = valid.find(v=>v.toLowerCase()===input.trim().toLowerCase());

  rec._editedBy = whoAmI(); rec._editedAt = new Date().toISOString();
  await persist();
  render();
}

function renderCard(rec, sectionKey){
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = rec.id;

  let titleText, bodyHtml, metaText;
  if(sectionKey==='policies'){
    titleText = rec.client;
    bodyHtml = rec.details ? linkify(rec.details) : '<span class="empty-url">No details filed yet.</span>';
    metaText = 'Exam policy';
  } else if(sectionKey==='faqs'){
    titleText = rec.question || '(untitled question)';
    bodyHtml = rec.answer ? linkify(rec.answer) : '<span class="empty-url">No answer filed yet.</span>';
    metaText = (rec.category || 'General');
  } else if(sectionKey==='websites'){
    titleText = rec.client;
    bodyHtml = (rec.url ? `<a href="${esc(rec.url)}" target="_blank" rel="noopener">${esc(rec.url)}</a>` : '<span class="empty-url">No URL filed yet.</span>') + (rec.notes ? '<br><br>'+linkify(rec.notes) : '');
    metaText = 'Website';
  } else if(sectionKey==='remote'){
    titleText = rec.app ? rec.app : rec.client;
    bodyHtml = (rec.app && rec.app!==rec.client ? `<strong>${esc(rec.client)}</strong><br>` : '') + (rec.notes ? linkify(rec.notes) : '<span class="empty-url">No notes filed yet.</span>');
    metaText = 'Remote desktop app';
  } else if(sectionKey==='troubleshooting'){
    titleText = rec.question || '(untitled issue)';
    bodyHtml = rec.answer ? linkify(rec.answer) : '<span class="empty-url">No steps filed yet.</span>';
    metaText = rec.client || 'General';
  }

  card.innerHTML = `
    <div class="card-top">
      <div class="card-top-left">
        ${sectionKey==='remote' && remoteAppIcon(rec.app) ? `<div class="card-icon"><img src="${remoteAppIcon(rec.app)}" alt=""></div>` : ''}
        <div>
          <div class="card-title">${esc(titleText)}</div>
          <div class="card-meta">${esc(metaText)}</div>
        </div>
      </div>
    </div>
    <div class="card-body">${bodyHtml}</div>
  `;

  if(sectionKey==='troubleshooting' && Array.isArray(rec.messages) && rec.messages.length){
    const msgWrap = document.createElement('div');
    msgWrap.style.cssText = 'margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-soft);';
    msgWrap.innerHTML = `<div style="font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin-bottom:8px;">Quick canned messages — click to copy</div>`;
    const grid = document.createElement('div');
    grid.className = 'qr-grid';
    rec.messages.forEach(m=>{
      const chip = document.createElement('div');
      chip.className = 'card qr-card';
      chip.style.cssText = 'padding:12px 14px;margin-bottom:0;';
      chip.title = 'Click to copy';
      chip.innerHTML = `
        <div class="card-top">
          <div><div class="card-title" style="font-size:12.5px;">${esc(m.label)}</div></div>
          <div class="card-actions"><div class="icon-btn copy-btn" title="Copy to clipboard">${copyIconSvg}</div></div>
        </div>
        <div class="card-body qr-text" style="margin-top:6px;">${esc(m.text)}</div>
      `;
      chip.onclick = ()=> copyToClipboard(m.text, chip, m.label);
      chip.querySelector('.copy-btn').onclick = (e)=>{ e.stopPropagation(); copyToClipboard(m.text, chip, m.label); };
      grid.appendChild(chip);
    });
    msgWrap.appendChild(grid);
    card.appendChild(msgWrap);

function openEditForm(card, rec, sectionKey){
  const cfg = SECTIONS[sectionKey];
  const form = document.createElement('div');
  form.className = 'edit-form';
  let fieldsHtml = '';
  cfg.fields.forEach(f=>{
    const val = esc(rec[f.key]||'');
    if(f.textarea){
      fieldsHtml += `<div><label>${esc(f.label)}</label><textarea data-key="${f.key}">${val}</textarea></div>`;
    } else if(f.select){
      const opts = f.select.map(o=>`<option value="${o}" ${rec[f.key]===o?'selected':''}>${o}</option>`).join('');
      fieldsHtml += `<div><label>${esc(f.label)}</label><select data-key="${f.key}">${opts}</select></div>`;
    } else {
      fieldsHtml += `<div><label>${esc(f.label)}</label><input type="text" data-key="${f.key}" value="${val}"></div>`;
    }
  });
  form.innerHTML = fieldsHtml + `<div class="form-actions"><button class="btn small save-btn">Save</button><button class="btn ghost small cancel-btn">Cancel</button></div>`;
  card.innerHTML = '';
  card.appendChild(form);
  form.querySelector('.save-btn').onclick = async ()=>{
    cfg.fields.forEach(f=>{
      const el = form.querySelector(`[data-key="${f.key}"]`);
      rec[f.key] = el.value;
    });
    rec._editedBy = whoAmI();
    rec._editedAt = new Date().toISOString();
    await persist();
    render();
  };
  form.querySelector('.cancel-btn').onclick = ()=> render();
}

function addNewRecord(sectionKey, presetClient){
  const cfg = SECTIONS[sectionKey];

  cfg.fields.forEach(f=> rec[f.key] = f.select ? f.select[f.select.length-1] : '' );

async function addIncident(){
  const name = prompt('Incident name:');
  if(!name || !name.trim()) return;
  const context = prompt('Context (e.g. Check in, Testing):', 'Check in') || '';
  const category = prompt('Category (e.g. Prohibited Behavior, Prohibited Items, Prohibited Electronic Device):', 'Prohibited Behavior') || '';
  let severity = prompt('Severity — type Minor or Major:', 'Minor') || 'Minor';
  severity = severity.trim().toLowerCase()==='major' ? 'Major' : 'Minor';
  let thresholdInput = prompt('Threshold (0–1000):', '1');
  let threshold = parseInt(thresholdInput, 10);
  if(isNaN(threshold)) threshold = 0;
  threshold = Math.max(0, Math.min(1000, threshold));

  const rec = { id: uid(), name: name.trim(), context: context.trim(), category: category.trim(), severity, threshold };
  data.incidents = data.incidents || [];
  data.incidents.unshift(rec);
  await persist();
  render();
}

  `;
  // Whole-card click copies the message. Icon buttons stop propagation so they don't double-fire.

async function copyToClipboard(text, card, label){
  let ok = false;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  }catch(e){ /* fall through to legacy copy */ }
  if(!ok){
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      ok = true;
    }catch(e){ ok = false; }
  }
  if(ok){
    flashCopied(card);
    showToast('Copied: ' + (label || 'message'));
  } else {
    alert('Could not copy automatically — please select and copy the text manually.');
  }
}
function flashCopied(card){
  if(!card) return;
  const btn = card.querySelector('.copy-btn');
  if(btn){
    const original = btn.innerHTML;
    btn.innerHTML = checkIconSvg;
    btn.classList.add('copied');
    setTimeout(()=>{ btn.innerHTML = original; btn.classList.remove('copied'); }, 1400);
  }
  card.classList.add('copied-flash');
  setTimeout(()=> card.classList.remove('copied-flash'), 420);
}
let toastTimer = null;
function showToast(text){
  const toast = document.getElementById('toast');
  document.getElementById('toastText').textContent = text;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toast.classList.remove('show'), 1800);
}

      render();
    }
    return;
  }
  if(activeSection==='incidents'){
    addIncident();
    return;
  }
  addNewRecord(activeSection);
};
document.getElementById('searchInput').oninput = (e)=>{ searchTerm = e.target.value; render(); };
document.getElementById('refreshBtn').onclick = ()=> pollForChanges();
document.getElementById('mobileToggle').onclick = ()=> document.getElementById('sidebar').classList.toggle('open');
document.getElementById('themeToggle').onclick = toggleTheme;

/* ============================= INIT ============================= */
initTheme();
loadData();
setInterval(pollForChanges, 6000);
</script>
</body>
</html>
