<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ops Vault — Five Acts Services Corp</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#f4f7fa; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  .frame-wrap { position:relative; width:100vw; height:100vh; }
  iframe {
    position:absolute; top:0; left:0; width:100%; height:100%; border:0; display:block;
  }
  .loading {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; color:#5b6b7c; font-size:14px; background:#f4f7fa;
    transition:opacity .25s ease; pointer-events:none;
  }
  .loading.hidden { opacity:0; }
  .spinner {
    width:22px; height:22px; border:2.5px solid #e1e7ee; border-top-color:#12a594; border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="frame-wrap">
  <div class="loading" id="loadingState">
    <div class="spinner"></div>
    <div>Loading Ops Vault…</div>
  </div>

  <!--
    IMPORTANT — replace the src below with the exact URL from Claude's
    "Get embed code" modal (Artifact panel → Publish → Get embed code).
    That modal generates the correct embeddable URL for your published
    artifact — it may differ slightly from the plain public link.
    Also make sure the domain this wrapper page is hosted on is listed
    in the "Allowed domains" field in that same modal, or the embed
    will be blocked from loading.
  -->
  <iframe
    id="vaultFrame"
    src="https://claude.ai/public/artifacts/4f024e32-9560-46d7-92b6-edfd17aa0b00"
    title="Five Acts Services Corp — Ops Vault"
    allow="clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
</div>

<script>
  const frame = document.getElementById('vaultFrame');
  const loading = document.getElementById('loadingState');
  frame.addEventListener('load', () => {
    loading.classList.add('hidden');
    setTimeout(() => { loading.style.display = 'none'; }, 300);
  });
</script>

</body>
</html>
